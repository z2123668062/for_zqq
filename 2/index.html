<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>青听 · 相册电台</title>
  <meta name="description" content="朱青青 ♡ 王羊羊 的稀罕小本子：音乐、故事和一整本照片" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="/photos/Q版朱青青.jpg" />
  <!-- iPhone 主屏幕图标：取方图（iOS 会自动裁成 180×180 圆角方块） -->
  <link rel="apple-touch-icon" href="/photos/Q版朱青青.jpg" />
  <meta name="theme-color" content="#f7efdd" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <!-- 桌面暖光 -->
  <div class="desk-light" aria-hidden="true"></div>

  <main class="journal">
    <!-- ===== 手账刊头 ===== -->
    <header class="masthead">
      <i class="tape tape-pink" aria-hidden="true"></i>
      <i class="tape tape-blue" aria-hidden="true"></i>
      <h1 class="journal-title">青听<span class="marker">· 相册电台</span></h1>
      <p class="journal-sub">朱青青 ♡ 王羊羊 的稀罕小本子</p>
      <span class="journal-date">二〇二六 · 冬 ♡</span>
    </header>

    <div class="journal-body">
      <!-- ===== 左页：歌单点阵纸 ===== -->
      <section class="page-list">
        <div class="tabs">
          <button id="tabMusic" class="tab active" type="button">🎵 音乐</button>
          <button id="tabStory" class="tab" type="button">📖 故事</button>
        </div>
        <ul id="songList" class="song-list">
          <li class="empty-tip">正在加载歌单…</li>
        </ul>
        <p class="page-list-foot">点一首，给它放出来 ♪</p>
      </section>

      <!-- ===== 右页：拍立得（手机横滑 / 桌面扇形） ===== -->
      <section class="page-main">
        <div id="photoDeck" class="photo-deck" title="点一下翻一张，拖动也行">
          <p class="deck-hint">· 我们的拍立得 ·</p>
        </div>
        <!-- 翻页圆点 -->
        <div id="photoDots" class="deck-dots" aria-label="照片切换"></div>
      </section>
    </div>
  </main>

  <!-- 迷你卡带：贴在屏幕下沿，永远够得着 -->
  <div id="cassette" class="dock">
    <!-- 磁带进度线 -->
    <div id="progressBar" class="dock-progress" role="slider" aria-label="播放进度">
      <div id="progressInner" class="dock-progress-inner"></div>
    </div>
    <div class="dock-body">
      <div class="reel reel-left" aria-hidden="true"></div>
      <div class="reel reel-right" aria-hidden="true"></div>
      <div class="dock-label">
        <div id="title" class="dock-title">等待播放…</div>
        <!-- 续播小纸片：有历史进度时出现，点击接着听 -->
        <button id="resumeChip" class="resume-chip" type="button" title="接着上次的位置播放" hidden>
          ♪ 继续 <span id="resumeTime">0:00</span>
        </button>
        <div class="dock-time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
      <button id="modeBtn" class="paper-btn pill dock-chip" type="button" title="播放模式">
        <span id="modeIcon" class="paper-icon"></span>
        <span id="modeLabel" class="paper-label">顺序</span>
      </button>
      <button id="speedBtn" class="paper-btn pill dock-chip" type="button" title="倍速" style="display:none">
        <span id="speedLabel" class="paper-label">1.0x</span>
      </button>
      <button id="prev" class="paper-btn dock-btn" type="button" title="上一首" aria-label="上一首">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M6 5h2v14H6zM20 5v14l-11-7z" />
        </svg>
      </button>
      <button id="playPause" class="play-btn dock-play" type="button" title="播放 / 暂停" aria-label="播放">
        <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M8 5.14v13.72L19 12z" />
        </svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" style="display:none">
          <path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z" />
        </svg>
      </button>
      <button id="next" class="paper-btn dock-btn" type="button" title="下一首" aria-label="下一首">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M16 5h2v14h-2zM4 5v14l11-7z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- 贴纸宠物：Q 版互相陪伴 -->
  <div class="pet pet-left" id="petLeft" title="王羊羊">
    <img src="/photos/Q版王羊羊.jpg" alt="王羊羊" />
    <span class="pet-heart">♡</span>
  </div>
  <div class="pet pet-right" id="petRight" title="朱青青">
    <img src="/photos/Q版朱青青.jpg" alt="朱青青" />
    <span class="pet-heart">♡</span>
  </div>

  <audio id="audio" preload="auto"></audio>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
