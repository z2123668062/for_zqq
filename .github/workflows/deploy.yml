name: Deploy to GitHub Pages

# 推送 main 分支（或手动触发）时：构建播放器 → 整站装配 → 自动发布
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 2/package-lock.json

      - name: Install player dependencies
        working-directory: 2
        run: npm ci

      - name: Build player (type-check + bundle)
        working-directory: 2
        run: npm run build

      # 整站装配：圣诞页保留在根目录，播放器构建产物放到 /2/，URL 与之前完全一致
      - name: Assemble static site
        run: |
          mkdir -p _site/2
          cp -r index.html 1 _site/
          cp -r 2/dist/. _site/2/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
